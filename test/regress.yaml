#
# Config file for regess.py, add new builds below
#

---

global:
    run_program: runEmu.py
    run_dir: "."
    run_args: AUTO -r
    setup_program: runEmu.py
    setup_dir: "."
    setup_args: EXTRACT -r
    Xcelium_Single_Core: 1

alpine_regbuild:
    domains: 32
    run_args: -p rv64_qh_regbuild -c cmd_files/bbl

rv64_qh_regbuild:
    domains: 4
    build_program: foo
    build_dir: .
    build_args: -a arg1 -b arg2
    run_args: -p rv64_qh_regbuild -c cmd_files/bbl

voxel_release_sim00_regbuild:
    domains: 8
    run_args:
        - "-p VOXEL/sowph1A_rel3 -c cmd_files/voxel_sowph --extdata VOXEL/sowph1A_rel3/extdata.128b.hex --sram VOXEL/sowph1A_rel3/sram_bXX.hex"
        - "-p VOXEL/sowph1B_rel1 -c cmd_files/voxel_sowph --extdata VOXEL/sowph1A_rel3/extdata.128b.hex --sram VOXEL/sowph1B_rel1/sram_bXX.hex"

rv64_ql_small_regbuild:
    domains: 1
    run_args: -p rv64_ql_regbuild -c cmd_files/bbl

rv64_ql_regbuild:
    domains: 2
    run_args: -p rv64_ql_regbuild -c cmd_files/bbl

voxel_release_sim01_regbuild:
    domains: 16
    run_args:
        - "-p VOXEL/sowph1A_rel3 -c cmd_files/voxel_sowph --extdata VOXEL/sowph1A_rel3/extdata.128b.hex --sram VOXEL/sowph1A_rel3/sram_bXX.hex"
        - "-p VOXEL/sowph1B_rel1 -c cmd_files/voxel_sowph --extdata VOXEL/sowph1A_rel3/extdata.128b.hex --sram VOXEL/sowph1B_rel1/sram_bXX.hex"
